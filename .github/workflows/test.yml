name: test

on:
  push:
    # branches-ignore alone means every branch BUT these; dependabot branches get the
    # pull_request run already (with the app skip below) — a second push run would only
    # duplicate it, and push events carry no head_ref, so app would run there and mail
    # a red report no dependabot PR could ever clear
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter texpile-editor check
      - run: pnpm --filter texpile-editor lint
      - run: pnpm --filter texpile-editor testonce
      - run: pnpm --filter texpile-typst-syntax-wasm test
      - run: pnpm --filter mathlive test
      - run: npx tsc -p electron --noEmit

  # Upstream Texpile's Electron integration suite — DISABLED: not adapted to the Typwriter fork
  # (the fork pivoted the app to a browser-hosted DSH plugin; the suite has never passed here,
  # 20+ failures from the missing Electron-side wiring). A permanently red check only mails
  # failure reports no one can act on yet, drowning the real signal. To re-enable once the
  # suite is adapted: delete the leading `false && ` in the condition below.
  app:
    runs-on: ubuntu-latest
    if: false && (github.event_name == 'push' || !startsWith(github.head_ref, 'dependabot/'))
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Save Package File drafts from what TeX reports
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-luatex texlive-latex-base texlive-latex-recommended texlive-pictures fonts-lmodern
      - run: xvfb-run -a -s '-screen 0 1400x900x24' pnpm --filter texpile-editor test:integration
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: app-test-report
          path: apps/texpile-editor/tests/integration/report
