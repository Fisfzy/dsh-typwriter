name: test

on:
  push:
    branches:
      - '**'
    # dependabot branches get the pull_request run already (with the app skip below); a second
    # push run would only duplicate it — and push events carry no head_ref, so app would run
    # there and mail a red report no dependabot PR could ever clear
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter texpile-editor check
      - run: pnpm --filter texpile-editor lint
      - run: pnpm --filter texpile-editor testonce
      - run: pnpm --filter texpile-typst-syntax-wasm test
      - run: pnpm --filter mathlive test
      - run: npx tsc -p electron --noEmit

  # Upstream Texpile's Electron integration suite — kept for signal, but NOT adapted to the
  # Typwriter fork yet (the fork pivoted the app to a browser-hosted DSH plugin, and this suite
  # has never passed here: 20+ failures from the missing Electron-side wiring). Dependabot
  # branches skip it (a red X they can never clear would just drown the useful test signal);
  # runs elsewhere stay non-blocking. Remove the skip and the flag once the suite is fixed.
  app:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'dependabot/')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Save Package File drafts from what TeX reports
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-luatex texlive-latex-base texlive-latex-recommended texlive-pictures fonts-lmodern
      - run: xvfb-run -a -s '-screen 0 1400x900x24' pnpm --filter texpile-editor test:integration
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: app-test-report
          path: apps/texpile-editor/tests/integration/report
